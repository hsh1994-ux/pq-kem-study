name: pq_results
description: Desktop viewer for the pq-kem-study results (results/raw/*.csv).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

# No third-party packages: only Flutter and dart:io, so the app builds the same
# way on macOS, Windows and Linux (x86-64 and ARM64) without plugins or CocoaPods.
dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
